<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Diwali · Layer 1</title>
<meta name="description" content="A Diwali wish from Layer 1.">
<meta property="og:type" content="website">
<meta property="og:title" content="Happy Diwali">
<meta property="og:description" content="A Diwali wish from Layer 1. Tap to open.">
<meta property="og:image" content="https://layer-i.github.io/greetings/diwali-2026/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://layer-i.github.io/greetings/diwali-2026/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1B1A16">
<link rel="preload" href="assets/bai-jamjuree-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/card.webp" as="image">
<style>
@font-face{font-family:'Bai Jamjuree';font-weight:300;font-display:swap;src:url(assets/bai-jamjuree-latin-300-normal.woff2) format('woff2')}
@font-face{font-family:'Bai Jamjuree';font-weight:400;font-display:swap;src:url(assets/bai-jamjuree-latin-400-normal.woff2) format('woff2')}
:root{--ink:#1B1A16;--bronze:#8E6A15;--gold:#C9A04A;--bone:#F1EADA;--warm:#F0CE78}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);overflow:hidden}
body{font-family:'Bai Jamjuree',system-ui,sans-serif;font-weight:300;color:var(--bone);display:flex;align-items:center;justify-content:center}
/* the phone-shaped stage: full screen on phones, a card on desktop */
#stage{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--ink)}
@media (min-aspect-ratio:3/4){#stage{width:min(100vw,calc(100dvh*0.5625));border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s .9s}
.screen.on{opacity:1;visibility:visible;transition:opacity .9s ease}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}

/* ── cover */
#cover .bg{background-image:url(assets/card.webp)}
.cover-words{position:absolute;left:0;right:0;top:20%;text-align:center;color:var(--ink);padding:0 14%}
.cover-words .k{font-size:clamp(13px,3.6vw,16px);letter-spacing:.22em;text-transform:uppercase;color:var(--bronze)}
.cover-words .n{font-size:clamp(28px,8.4vw,40px);line-height:1.18;margin-top:.5em}
#seal{position:absolute;left:50%;top:56%;width:min(34vw,170px);aspect-ratio:1;transform:translate(-50%,-50%);cursor:pointer;border:0;background:none;filter:drop-shadow(0 6px 10px rgba(60,40,10,.35))}
#seal svg{width:100%;height:100%;display:block;overflow:visible}
#seal .mono{position:absolute;inset:27% 24% 29% 27%;background:#5e4410;-webkit-mask:url(assets/monogram.svg) center/contain no-repeat;mask:url(assets/monogram.svg) center/contain no-repeat;filter:drop-shadow(0 1px 0 rgba(255,225,150,.55)) drop-shadow(0 -1px 0 rgba(40,25,0,.5))}
#seal .halfL,#seal .halfR{position:absolute;inset:0;transition:transform 1.1s cubic-bezier(.6,0,.3,1),opacity 1.1s}
#seal .halfL{clip-path:polygon(0 0,52% 0,47% 30%,53% 55%,46% 78%,51% 100%,0 100%)}
#seal .halfR{clip-path:polygon(52% 0,100% 0,100% 100%,51% 100%,46% 78%,53% 55%,47% 30%)}
#seal.broken .halfL{transform:translateX(-26%) rotate(-14deg);opacity:0}
#seal.broken .halfR{transform:translateX(26%) rotate(14deg);opacity:0}
.hint{position:absolute;left:0;right:0;bottom:12%;text-align:center;color:var(--bronze);font-size:14px;letter-spacing:.18em;text-transform:uppercase;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}

/* ── shutters */
#shutters{position:absolute;inset:0;perspective:1400px;pointer-events:none;z-index:5;visibility:hidden}
#shutters.show{visibility:visible}
.leaf{position:absolute;top:0;bottom:0;width:50%;background-image:url(assets/shutters.webp);background-size:200% 100%;transition:transform 2.2s cubic-bezier(.55,0,.25,1)}
.leaf.l{left:0;background-position:left center;transform-origin:left center}
.leaf.r{right:0;background-position:right center;transform-origin:right center}
#shutters.open .leaf.l{transform:rotateY(-104deg)}
#shutters.open .leaf.r{transform:rotateY(104deg)}
#spill{position:absolute;inset:0;background:radial-gradient(ellipse 30% 60% at 50% 55%,rgba(240,206,120,.85),rgba(214,162,46,.25) 45%,transparent 70%);opacity:0;transition:opacity 1.2s ease;z-index:4;pointer-events:none}

/* ── scene */
#scene .layer{position:absolute;inset:-4%;background-size:cover;background-position:center;will-change:transform}
#scene .sky{background-image:url(assets/scene.webp)}
#scene .front{background-image:url(assets/foreground.webp)}
#glow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
.title{position:absolute;left:0;right:0;top:9%;text-align:center;padding:0 10%;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.title h1{font-weight:300;font-size:clamp(40px,12vw,60px);letter-spacing:.01em;color:var(--bone)}
.title p{font-size:clamp(15px,4.2vw,18px);line-height:1.55;margin-top:.8em;color:rgba(241,234,218,.88)}
.reveal{opacity:0;transform:translateY(14px);transition:opacity 1.2s ease,transform 1.2s ease}
.on .reveal{opacity:1;transform:none}
.on .reveal.d1{transition-delay:.9s}.on .reveal.d2{transition-delay:1.6s}

/* ── five days */
#days{background:radial-gradient(ellipse at 50% 30%,#2a2620,var(--ink) 75%)}
#days h2{position:absolute;top:8%;left:0;right:0;text-align:center;font-weight:300;font-size:clamp(28px,8vw,38px)}
#days ul{position:absolute;top:19%;left:9%;right:9%;list-style:none;display:flex;flex-direction:column;gap:2.2vh}
#days li{display:flex;align-items:center;gap:5%;opacity:.55;transition:opacity .6s}
#days li .ic{width:min(19vw,92px);aspect-ratio:1;background-image:url(assets/icons.webp);background-size:500% 100%;background-repeat:no-repeat;flex:none}
#days li .t b{display:block;font-weight:400;font-size:clamp(17px,4.8vw,21px);color:var(--bone)}
#days li .t span{font-size:clamp(13px,3.6vw,15px);color:var(--gold);letter-spacing:.06em}
#days li.today{opacity:1}
#days li.today .ic{filter:drop-shadow(0 0 14px rgba(240,206,120,.65))}
#days li.today .t span::after{content:' · today';color:var(--warm)}
#days li.tomorrow .t span::after{content:' · tomorrow'}

/* ── light */
#light{background:var(--ink);transition:background 2.4s ease}
#light.lit{background:radial-gradient(ellipse 80% 60% at 50% 40%,#5a3d12 0%,#2b2214 45%,var(--ink) 80%)}
#diya{position:absolute;left:50%;top:34%;width:min(46vw,230px);aspect-ratio:1;transform:translate(-50%,-50%);border:0;background:url(assets/diya.webp) center/contain no-repeat;cursor:pointer}
#flame{position:absolute;left:var(--fx,71%);top:var(--fy,38%);width:13%;height:30%;transform:translate(-50%,-100%) scale(0);transform-origin:50% 100%;transition:transform .7s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
#light.lit #flame{transform:translate(-50%,-100%) scale(1)}
#flame i{position:absolute;inset:0;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 78%,#fff8e6 0%,#ffe2a0 22%,#f6b24a 48%,rgba(214,120,30,.0) 72%);animation:flick 1.7s ease-in-out infinite alternate}
#flame::after{content:'';position:absolute;left:50%;top:60%;width:900%;height:600%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(240,190,90,.35),transparent 60%);border-radius:50%}
@keyframes flick{0%{transform:scale(1,1) skewX(0)}25%{transform:scale(.94,1.05) skewX(2deg)}55%{transform:scale(1.04,.96) skewX(-2deg)}80%{transform:scale(.97,1.03) skewX(1deg)}100%{transform:scale(1.02,.99) skewX(-1deg)}}
.lhint{position:absolute;left:0;right:0;top:53%;text-align:center;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);animation:breathe 2.6s ease-in-out infinite;transition:opacity .6s}
#light.lit .lhint{opacity:0;animation:none}
.after{position:absolute;left:0;right:0;top:51%;text-align:center;padding:0 10%;opacity:0;transform:translateY(12px);transition:opacity 1.2s ease .6s,transform 1.2s ease .6s;pointer-events:none}
#light.lit .after{opacity:1;transform:none;pointer-events:auto}
.after h2{font-weight:300;font-size:clamp(32px,9.5vw,46px)}
.after p{font-size:clamp(14px,4vw,17px);color:rgba(241,234,218,.82);margin-top:.5em;line-height:1.5}
.share{margin-top:5vh;display:flex;flex-direction:column;gap:12px;align-items:center}
.share input{width:min(78vw,320px);padding:13px 16px;border-radius:10px;border:1px solid rgba(201,160,74,.45);background:rgba(27,26,22,.55);color:var(--bone);font:inherit;font-size:16px;text-align:center}
.share input::placeholder{color:rgba(241,234,218,.45)}
.share a{display:block;width:min(78vw,320px);padding:14px 16px;border-radius:10px;background:var(--bronze);color:var(--bone);text-decoration:none;font-weight:400;font-size:16px;letter-spacing:.04em}
.wm{position:absolute;left:50%;bottom:4.5%;width:min(26vw,120px);aspect-ratio:3457.5/936;transform:translateX(-50%);background:var(--bronze);-webkit-mask:url(assets/wordmark.svg) center/contain no-repeat;mask:url(assets/wordmark.svg) center/contain no-repeat;opacity:.9}

/* ── navigation */
.dots{position:absolute;left:0;right:0;bottom:2.2%;display:flex;justify-content:center;gap:9px;z-index:8;opacity:0;transition:opacity .6s;pointer-events:none}
.dots.show{opacity:1}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(241,234,218,.3);transition:background .4s,transform .4s}
.dots i.on{background:var(--warm);transform:scale(1.25)}
.tapzone{position:absolute;top:0;bottom:0;z-index:7}
.tapzone.prev{left:0;width:30%}.tapzone.next{right:0;width:70%}
#sound{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;z-index:9;width:36px;height:36px;border-radius:50%;border:1px solid rgba(201,160,74,.4);background:rgba(27,26,22,.35);color:var(--gold);font-size:15px;display:none}
#sound.show{display:block}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>
<div id="stage">

 <section class="screen on" id="cover" aria-label="Cover. Touch anywhere to open" role="button" tabindex="0" style="cursor:pointer">
  <div class="bg"></div>
  <div class="cover-words"><div class="k">A Diwali wish</div><div class="n">for you<br>and your family</div></div>
  <button id="seal" aria-label="Open the wish">
   <div class="halfL"><svg viewBox="0 0 100 100"><defs><radialGradient id="wax" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#c79a3c"/><stop offset=".45" stop-color="#9a7020"/><stop offset="1" stop-color="#5c420f"/></radialGradient></defs><path fill="url(#wax)" d="M50 3c7 0 9 3 15 4s10 1 14 6 3 8 7 13 6 8 6 14-3 8-2 14 2 10-2 15-8 5-11 10-5 9-11 11-9 0-15 1-10 4-16 2-8-5-13-8-10-3-13-9-1-9-4-14-6-8-6-14 4-9 4-15-1-9 3-14 9-4 13-7 7-7 13-8 9-3 15-3z"/><circle cx="50" cy="50" r="33" fill="none" stroke="#6b4c12" stroke-width="1.4" opacity=".7"/><circle cx="50" cy="50" r="30" fill="none" stroke="#e2bd6a" stroke-width=".6" opacity=".45"/></svg><div class="mono"></div></div>
   <div class="halfR"><svg viewBox="0 0 100 100"><path fill="url(#wax)" d="M50 3c7 0 9 3 15 4s10 1 14 6 3 8 7 13 6 8 6 14-3 8-2 14 2 10-2 15-8 5-11 10-5 9-11 11-9 0-15 1-10 4-16 2-8-5-13-8-10-3-13-9-1-9-4-14-6-8-6-14 4-9 4-15-1-9 3-14 9-4 13-7 7-7 13-8 9-3 15-3z"/><circle cx="50" cy="50" r="33" fill="none" stroke="#6b4c12" stroke-width="1.4" opacity=".7"/><circle cx="50" cy="50" r="30" fill="none" stroke="#e2bd6a" stroke-width=".6" opacity=".45"/></svg><div class="mono"></div></div>
  </button>
  <div class="hint">Touch to open</div>
 </section>

 <section class="screen" id="scene" aria-label="Happy Diwali">
  <div class="layer sky" data-depth="0.25"></div>
  <canvas id="glow"></canvas>
  <div class="layer front" data-depth="0.7"></div>
  <div class="title"><h1 class="reveal d1">Happy Diwali</h1><p class="reveal d2">May every room of your home be filled with light, and every day of the new year with warmth.</p></div>
 </section>

 <section class="screen" id="days" aria-label="Five days of light">
  <h2>Five days of light</h2>
  <ul id="dayList"></ul>
 </section>

 <section class="screen" id="light" aria-label="Light a diya">
  <button id="diya" aria-label="Light the diya"><span id="flame"><i></i></span></button>
  <div class="lhint">Tap to light it</div>
  <div class="after">
   <h2>and Saal Mubarak</h2>
   <p>Pass the light on to someone you love.</p>
   <div class="share">
    <a id="wa" href="#" target="_blank" rel="noopener">Forward on WhatsApp</a>
   </div>
  </div>
  <div class="wm" aria-label="Layer 1"></div>
 </section>

 <div id="spill"></div>
 <div id="shutters"><div class="leaf l"></div><div class="leaf r"></div></div>
 <div class="tapzone prev" hidden></div><div class="tapzone next" hidden></div>
 <div class="dots" id="dots"><i></i><i></i><i></i></div>
 <button id="sound" aria-label="Sound on or off">♪</button>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const PAGE='https://layer-i.github.io/greetings/diwali-2026/';
const screens=['scene','days','light'];
let idx=-1, opened=false;


// ── sound: soft, motion-led, made in the browser; nothing to download
let ac=null, muted=false;
const tone=(type)=>{ if(muted)return; try{
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const t=ac.currentTime, len={crack:.25,open:2.4,tick:.12,light:1.1}[type];
  const buf=ac.createBuffer(1,ac.sampleRate*len,ac.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=ac.createBufferSource(); src.buffer=buf;
  const f=ac.createBiquadFilter(), g=ac.createGain();
  f.type='bandpass';
  if(type==='crack'){f.frequency.value=1800;f.Q.value=.8;g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);}
  if(type==='open'){f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(2400,t+2.2);f.Q.value=.6;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+1.2);g.gain.exponentialRampToValueAtTime(.0001,t+2.4);}
  if(type==='tick'){f.frequency.value=2400;f.Q.value=1.2;g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);}
  if(type==='light'){f.frequency.setValueAtTime(500,t);f.frequency.exponentialRampToValueAtTime(1400,t+.4);f.Q.value=.7;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+1.1);}
  src.connect(f).connect(g).connect(ac.destination); src.start(t); src.stop(t+len);
}catch(e){} };
$('#sound').onclick=e=>{e.stopPropagation();muted=!muted;$('#sound').style.opacity=muted?.4:1;};

// ── five days, with today marked (India time)
const DAYS=[['Dhanteras','2026-11-06','Friday 6 November'],['Kali Chaudas','2026-11-07','Saturday 7 November'],['Diwali','2026-11-08','Sunday 8 November'],['Bestu Varas · New Year','2026-11-10','Tuesday 10 November'],['Bhai Dooj','2026-11-11','Wednesday 11 November']];
const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date());
const tom=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date(Date.now()+864e5));
$('#dayList').innerHTML=DAYS.map((d,i)=>`<li class="${d[1]===today?'today':d[1]===tom?'tomorrow':''}"><div class="ic" style="background-position:${i*25}% 0"></div><div class="t"><b>${d[0]}</b><span>${d[2]}</span></div></li>`).join('');
// on the gap day (9 Nov) Diwali reads as yesterday's glow: keep Diwali lit
if(today==='2026-11-09')$('#dayList').children[2].classList.add('today');

// ── navigation
const dots=[...document.querySelectorAll('.dots i')];
function go(n){
  if(n<0||n>=screens.length||n===idx)return;
  if(idx>=0)$('#'+screens[idx]).classList.remove('on');
  idx=n; $('#'+screens[idx]).classList.add('on');
  dots.forEach((d,i)=>d.classList.toggle('on',i===idx));
  if(idx>0)tone('tick');
}
$('.tapzone.next').onclick=()=>go(idx+1);
$('.tapzone.prev').onclick=()=>go(idx-1);
let sx=null;
$('#stage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
$('#stage').addEventListener('touchend',e=>{ if(sx===null||!opened)return; const dx=e.changedTouches[0].clientX-sx; sx=null;
  if(Math.abs(dx)>50){ e.preventDefault(); go(idx+(dx<0?1:-1)); } });
document.addEventListener('keydown',e=>{ if(!opened)return; if(e.key==='ArrowRight')go(idx+1); if(e.key==='ArrowLeft')go(idx-1); });
// the last screen's controls sit above the tap zones
const setZones=()=>{ const last=idx===screens.length-1; document.querySelectorAll('.tapzone').forEach(z=>z.style.display=last?'none':''); if(last){ $('.tapzone.prev').style.display=''; $('.tapzone.prev').style.width='18%'; } else $('.tapzone.prev').style.width='30%'; };
new MutationObserver(setZones).observe($('#light'),{attributes:true,attributeFilter:['class']});

// ── the opening: seal splits, shutters swing open, light spills out
const openCard=async()=>{
  if(opened)return; opened=true;
  try{ if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); }catch(e){}
  tone('crack');
  $('#seal').classList.add('broken'); $('.hint').style.opacity=0;
  setTimeout(()=>{ $('#shutters').classList.add('show'); $('#cover').classList.remove('on'); },500);
  setTimeout(()=>{ go(0); },700);
  setTimeout(()=>{ tone('open'); $('#shutters').classList.add('open'); $('#spill').style.opacity=1; },1100);
  setTimeout(()=>{ $('#spill').style.opacity=0; },2600);
  setTimeout(()=>{ $('#shutters').classList.remove('show'); document.querySelectorAll('.tapzone').forEach(z=>z.hidden=false); $('#dots').classList.add('show'); $('#sound').classList.add('show'); setZones(); },3500);
};
// a touch anywhere on the card opens it
$('#cover').addEventListener('click',openCard);
$('#cover').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openCard(); } });

// ── the scene: depth with tilt (or a slow drift), and living light
const layers=[...document.querySelectorAll('#scene .layer')];
let tx=0,ty=0,cx=0,cy=0,tilt=false;
addEventListener('deviceorientation',e=>{ if(e.gamma==null)return; tilt=true; tx=Math.max(-1,Math.min(1,e.gamma/25)); ty=Math.max(-1,Math.min(1,(e.beta-45)/25)); });
addEventListener('pointermove',e=>{ if(tilt)return; const r=$('#stage').getBoundingClientRect(); tx=((e.clientX-r.left)/r.width-.5)*2; ty=((e.clientY-r.top)/r.height-.5)*2; });
const cv=$('#glow'), g=cv.getContext('2d');
const sparks=Array.from({length:38},()=>({x:Math.random(),y:Math.random(),v:.0006+Math.random()*.0012,s:1+Math.random()*2.2,p:Math.random()*6.28}));
function frame(t){
  const on=idx===0;
  if(on){
    if(!tilt){ tx=tx*.98+Math.sin(t/4200)*.02*0.4; ty=ty*.98+Math.cos(t/5300)*.02*0.3; }
    cx+=(tx-cx)*.06; cy+=(ty-cy)*.06;
    layers.forEach(l=>{ const d=+l.dataset.depth; l.style.transform=`translate3d(${-cx*d*18}px,${-cy*d*12}px,0)`; });
    const w=cv.width=cv.clientWidth*devicePixelRatio, h=cv.height=cv.clientHeight*devicePixelRatio;
    const fl=.9+.06*Math.sin(t/130)+.04*Math.sin(t/57);
    const gr=g.createRadialGradient(w*.5,h*.72,0,w*.5,h*.72,h*.6);
    gr.addColorStop(0,`rgba(240,180,80,${.16*fl})`); gr.addColorStop(1,'rgba(240,180,80,0)');
    g.fillStyle=gr; g.fillRect(0,0,w,h);
    for(const s of sparks){ s.y-=s.v; if(s.y<.25){s.y=1;s.x=Math.random();}
      const a=Math.min(1,(s.y-.25)*2.5)*(.5+.5*Math.sin(t/300+s.p));
      g.fillStyle=`rgba(255,214,140,${.55*a})`; g.beginPath(); g.arc((s.x+Math.sin(t/2000+s.p)*.01)*w,s.y*h,s.s*devicePixelRatio,0,7); g.fill(); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ── light it, pass it on
$('#diya').onclick=()=>{ if($('#light').classList.contains('lit'))return; tone('light'); $('#light').classList.add('lit'); };
const waLink=()=>'https://wa.me/?text='+encodeURIComponent('Happy Diwali. A Diwali wish for you: '+PAGE);
$('#wa').onclick=e=>{ e.preventDefault(); location.href=waLink(); };
})();
</script>
</body>
</html>
