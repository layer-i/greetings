:root{--ink:#1B1A16;--night:#141a2e;--bronze:#8E6A15;--gold:#C9A04A;--bone:#F1EADA;--warm:#F0CE78}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:'Bai Jamjuree',system-ui,sans-serif;font-weight:300;color:var(--bone);display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#stage{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#15120d;touch-action:manipulation}

#gl{position:absolute;inset:0;width:100%;height:100%;display:block}

/* while loading: the paper colour, a breathing seal */
#loader{position:absolute;inset:0;display:grid;place-items:center;background:#ece0c6;z-index:5;transition:opacity .8s}
#loader i{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(142,106,21,.35);border-top-color:var(--bronze);animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#touch{position:absolute;left:0;right:0;bottom:calc(10% + env(safe-area-inset-bottom));text-align:center;font-size:15px;font-weight:400;letter-spacing:.05em;color:var(--bronze);opacity:0;pointer-events:none;z-index:6}
#hit{position:absolute;inset:0;z-index:7;cursor:pointer;display:none}

/* the greeting, over the courtyard */
#ui{position:absolute;inset:0;z-index:8;pointer-events:none;visibility:hidden}
.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;right:8px;display:flex;align-items:center;justify-content:space-between}
.wm{width:88px;aspect-ratio:3457.5/936;background:var(--bone);-webkit-mask:url(assets/wordmark.svg) center/contain no-repeat;mask:url(assets/wordmark.svg) center/contain no-repeat;opacity:.85}

#sound .off{display:none}#sound.muted .on{display:none}#sound.muted .off{display:block}
#scrim{position:absolute;left:0;right:0;top:0;height:30%;background:linear-gradient(180deg,rgba(8,7,12,.62),rgba(8,7,12,.3) 50%,rgba(8,7,12,0));pointer-events:none}
#msg{position:absolute;left:0;right:0;top:calc(max(14px,env(safe-area-inset-top)) + 50px);text-align:center;padding:0 8%;text-shadow:0 2px 18px rgba(8,8,16,.75),0 0 2px rgba(8,8,16,.5)}
#msg h1{font-weight:300;font-size:clamp(34px,10vw,50px);line-height:1.08;letter-spacing:.01em}
#msg p{font-size:clamp(14px,4vw,17px);line-height:1.55;margin-top:.5em;color:rgba(241,234,218,.9)}

#hint{position:absolute;left:0;right:0;bottom:calc(80px + env(safe-area-inset-bottom));text-align:center;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--warm);opacity:0;text-shadow:0 1px 8px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.9)}

<script type="module">
import * as THREE from 'three';
const G=window.gsap;
const $=s=>document.querySelector(s);
const PAGE='https://layer-i.github.io/greetings/diwali-2026/';
const CDN='https://d2ol7oe51mr4n9.cloudfront.net/user_3KBdapm6RLFCt8hz0uFJiAxm6LA/';
const A={card:'d92bf645-2cda-47e2-97bc-e5f788e5b82d.webp',seal:'d9de1222-74c5-491e-8599-c320b7f23078.webp',front:'c9b4b98a-95d8-48a5-9293-5bda6a4cd6b5.webp',icons:'c81eb035-64fd-4790-ab85-530886649129.webp',mask:'d54087f7-57fc-4825-969c-c44e4c600ff5.png',fw:'6e2809ae-7b74-48c4-9647-2fea03473394.webp'};
document.documentElement.style.setProperty('--icons',`url(${CDN+A.icons})`);

/* ── the five festivals: one courtyard, five lights */
const F=[
 {id:'dhanteras',name:'Dhanteras',date:'2026-11-06',img:'2eb009de-43b5-4284-9f11-7f963b00ba5f.webp',greet:'Happy Dhanteras',wish:'May this Dhanteras bring lasting prosperity to your home.',fwd:'Happy Dhanteras.',front:0,sparks:0,fw:.45},
 {id:'kali',name:'Kali Chaudas',date:'2026-11-07',img:'e2c9aa1a-34cb-4fb3-b1c0-44e436fbb601.webp',greet:'Kali Chaudas',wish:'May every lamp tonight keep the dark from your door.',fwd:'Wishing you a blessed Kali Chaudas.',front:0,sparks:0,fw:.6},
 {id:'diwali',name:'Diwali',date:'2026-11-08',img:'846ad6ec-ae59-4fe9-8be0-d91ddb7872ea.webp',greet:'Happy Diwali',wish:'May every room of your home be filled with light.',fwd:'Happy Diwali.',front:0,sparks:0,fw:1},
 {id:'bestu',name:'New Year',date:'2026-11-10',img:'4b810d97-5d55-4f6e-b463-c145733d79c3.webp',greet:'Saal Mubarak',wish:'May the new year open every door for you.',fwd:'Saal Mubarak.',front:0,sparks:0,fw:0},
 {id:'bhaidooj',name:'Bhai Dooj',date:'2026-11-11',img:'a74961da-b2bc-4334-a92c-32eca0d5d154.webp',greet:'Happy Bhai Dooj',wish:'To the bonds that light our lives.',fwd:'Happy Bhai Dooj.',front:0,sparks:0,fw:0},
];
const todayIN=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date());
let cur=F.findIndex(f=>f.date===todayIN); if(todayIN==='2026-11-09'||cur<0)cur=2;
const TODAY=cur;

/* ── sound: soft, made in the browser, led by the motion */
let ac=null, muted=false;
const sfx=type=>{ if(muted)return; try{
  ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended')ac.resume();
  const t=ac.currentTime, len={click:.25,swing:1.8,sweep:1.6,tick:.12,pop:.9}[type];
  const buf=ac.createBuffer(1,Math.ceil(ac.sampleRate*len),ac.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=ac.createBufferSource(); src.buffer=buf; const f=ac.createBiquadFilter(), g=ac.createGain(); f.type='bandpass';
  const env=(a,b,c)=>{g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(a,t+b);g.gain.exponentialRampToValueAtTime(.0001,t+c);};
  if(type==='click'){f.frequency.value=1900;f.Q.value=1.1;env(.28,.003,.16);}
  if(type==='swing'){f.frequency.setValueAtTime(240,t);f.frequency.exponentialRampToValueAtTime(1500,t+1.5);f.Q.value=.5;env(.06,.7,1.75);}
  if(type==='sweep'){f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(3200,t+1.3);f.Q.value=.6;env(.035,.6,1.55);}
  if(type==='pop'){f.type='lowpass';f.frequency.setValueAtTime(420,t);f.frequency.exponentialRampToValueAtTime(140,t+.5);f.Q.value=.7;env(.07,.006,.75);}
  if(type==='tick'){f.frequency.value=2600;f.Q.value=1.4;env(.05,.003,.09);}
  src.connect(f).connect(g).connect(ac.destination); src.start(t); src.stop(t+len);
}catch(e){} };
$('#sound').addEventListener('click',e=>{e.stopPropagation();muted=!muted;$('#sound').classList.toggle('muted',muted);});

/* ── the greeting overlay */
const days=$('#days');
days.innerHTML=F.map((f,i)=>`<button role="tab" data-i="${i}" aria-label="${f.name}"><div class="ic" style="background-position:${i*25}% 0"></div><span>${f.name}</span></button>`).join('');
const nb=t=>t.replace(/ (\S+)$/,'\u00a0$1');
function selectIcon(i,animate){
  [...days.children].forEach((b,j)=>{ const ic=b.querySelector('.ic'), on=j===i; b.classList.toggle('on',on); b.setAttribute('aria-selected',on);
    if(!G||!animate){ ic.style.transform=on?'translateY(-6px) scale(1.55)':'none'; return; }
    G.killTweensOf(ic);
    if(on) G.fromTo(ic,{scale:.85,y:0},{scale:1.55,y:-6,duration:.7,ease:'back.out(2.4)'});
    else G.to(ic,{scale:1,y:0,duration:.45,ease:'power2.out'}); });
}
function setText(i,animate){
  const f=F[i];
  if(!animate||!G){ $('#greet').textContent=nb(f.greet); $('#wish').textContent=nb(f.wish); return; }
  G.to('#msg',{opacity:0,filter:'blur(4px)',duration:.7,ease:'sine.in',onComplete:()=>{ $('#greet').textContent=nb(f.greet); $('#wish').textContent=nb(f.wish); G.to('#msg',{opacity:1,filter:'blur(0px)',duration:1.3,delay:.5,ease:'sine.out'}); }});
}
$('#fwd').addEventListener('click',e=>{ e.preventDefault(); location.href='https://wa.me/?text='+encodeURIComponent(F[TODAY].fwd+' A little light for you: '+PAGE); });

/* ── loading helpers */
const loadImg=src=>new Promise((res,rej)=>{ const i=new Image(); i.crossOrigin='anonymous'; i.onload=()=>res(i); i.onerror=()=>{ const j=new Image(); j.crossOrigin='anonymous'; j.onload=()=>res(j); j.onerror=rej; j.src=src+'?r=1'; }; i.src=src; });
const fontsReady=Promise.all([document.fonts.load("300 80px 'Bai Jamjuree'"),document.fonts.load("400 30px 'Bai Jamjuree'")]).catch(()=>{});

/* ── 3D or plain? */
const canvas=$('#gl');
let renderer=null;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'}); }catch(e){ renderer=null; }
if(!renderer){ plainVersion(); } else { threeVersion().catch(err=>{ console.error(err); plainVersion(); }); }

async function threeVersion(){
  const stage=$('#stage');
  const TEST=new URLSearchParams(location.search).has('test');
  renderer.setPixelRatio(TEST?.5:Math.min(devicePixelRatio,2));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.NoToneMapping;
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x15120d,1);
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(40,1,.05,40);
  const TAN=Math.tan(THREE.MathUtils.degToRad(20));
  const visH=d=>2*d*TAN;

  // load the cover first, the courtyard alongside
  const texLoader=img=>{ const t=new THREE.Texture(img); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy()); t.needsUpdate=true; return t; };
  const [cardImg,sealImg]=await Promise.all([loadImg(CDN+A.card),loadImg(CDN+A.seal),fontsReady]);
  const courtPromise=Promise.all([loadImg(CDN+F[cur].img),loadImg(CDN+A.mask)]);

  // the card face: the painted card with its words printed across the fold, as on a real gatefold
  const cc=document.createElement('canvas'); cc.width=1080; cc.height=1910; const x=cc.getContext('2d');
  x.drawImage(cardImg,0,0,1080,1910);
  x.textAlign='center'; x.fillStyle='#8E6A15'; x.font="400 40px 'Bai Jamjuree'";
  if('letterSpacing' in x) x.letterSpacing='10px';
  x.fillText('DIWALI 2026',540,385);
  if('letterSpacing' in x) x.letterSpacing='0px';
  x.fillStyle='#1B1A16'; x.font="300 86px 'Bai Jamjuree'";
  x.fillText('Please accept',540,505); x.fillText('our warmest greetings',540,610); x.fillText('this Diwali',540,715);
  const cardTex=texLoader(cc); const sealTex=texLoader(sealImg);

  // ── the card: two pages that bend as they turn
  const card=new THREE.Group(); scene.add(card);
  const SEG=28;
  const pageMat=new THREE.MeshStandardMaterial({map:cardTex,roughness:.9,metalness:0});
  const backMat=new THREE.MeshStandardMaterial({color:0xe6d6b4,roughness:.95,metalness:0,side:THREE.BackSide});
  function makePage(side){ // side -1 = left page (hinge at left edge), +1 = right page
    const geo=new THREE.PlaneGeometry(1,1,SEG,1);
    const uv=geo.attributes.uv;
    for(let i=0;i<uv.count;i++){ const u=uv.getX(i); uv.setX(i, side<0? u*.5 : .5+u*.5); }
    const g=new THREE.Group();
    const front=new THREE.Mesh(geo,pageMat), back=new THREE.Mesh(geo,backMat);
    front.castShadow=back.castShadow=true; front.receiveShadow=true;
    g.add(front,back); card.add(g);
    return {side,geo,g,front,back,angle:0,bend:0};
  }
  const L=makePage(-1), R=makePage(1);
  const sealGeo=new THREE.PlaneGeometry(1,1);
  const seal=new THREE.Mesh(sealGeo,new THREE.MeshStandardMaterial({map:sealTex,transparent:true,roughness:.45,metalness:.35,alphaTest:.02}));
  seal.castShadow=true; card.add(seal);
  const sealShadow=new THREE.Mesh(new THREE.CircleGeometry(.5,40),new THREE.MeshBasicMaterial({color:0x3c2608,transparent:true,opacity:.18,depthWrite:false}));
  card.add(sealShadow);

  let CW=1,CH=1; // card width and height in world units
  const pos=new THREE.Vector3();
  // bend a page: columns of the plane follow an arc from the hinge
  function shapePage(P){
    const p=P.geo.attributes.position, half=CW/2, dx=half/SEG;
    let ax=0, az=0; const xs=[0], zs=[0];
    for(let i=1;i<=SEG;i++){ const u=i/SEG; const th=P.angle+P.bend*u*u; ax+=Math.cos(th)*dx; az+=Math.sin(th)*dx; xs.push(ax); zs.push(az); }
    // vertex order: rows top then bottom, columns 0..SEG
    for(let r=0;r<2;r++) for(let i=0;i<=SEG;i++){
      const idx=r*(SEG+1)+i; const col=P.side<0? i : SEG-i;
      const xx=P.side<0? -half+xs[col] : half-xs[col];
      p.setXYZ(idx, xx, (r===0? CH/2 : -CH/2), zs[col]+(P.side<0?.0025:0));
    }
    p.needsUpdate=true; P.geo.computeVertexNormals(); P.geo.computeBoundingSphere();
    return {x:P.side<0? -half+xs[SEG] : half-xs[SEG], z:zs[SEG]+(P.side<0?.0025:0), th:P.angle+P.bend};
  }

  // ── the courtyard: sky, building and garlands at three depths
  const blank=document.createElement('canvas'); blank.width=blank.height=2;
  const maskTex=new THREE.Texture(blank); maskTex.needsUpdate=true;
  const ambTex={}; ambTex[cur]=texLoader(blank);
  const vert=`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`;
  // a change of day behaves like a lighting scene change: the room settles a little warmer and lower, then rises into the new scene
  const frag=(useMask)=>`
    uniform sampler2D a; uniform sampler2D b; uniform sampler2D m; uniform float p; uniform float dim; varying vec2 vUv;
    void main(){
      vec3 ca=texture2D(a,vUv).rgb, cb=texture2D(b,vUv).rgb;
      float k=smoothstep(.22,.78,p), mid=sin(p*3.14159);
      vec3 col=mix(ca,cb,k);
      col*=1.-.38*mid;
      col*=mix(vec3(1.),vec3(1.,.9,.76),mid*.55);
      float ed=smoothstep(0.,.02,min(min(vUv.x,1.-vUv.x),min(vUv.y,1.-vUv.y)));
      vec3 ink=vec3(.0075,.006,.004);
      float al=1.;
      ${useMask?'al=texture2D(m,vUv).r*smoothstep(0.,.025,vUv.y);':'col=mix(ink,col,ed);'}
      col=mix(ink,col,dim*dim);
      gl_FragColor=vec4(col,al);
      #include <colorspace_fragment>
    }`;
  const mkLayer=(useMask)=>new THREE.ShaderMaterial({uniforms:{a:{value:ambTex[cur]},b:{value:ambTex[cur]},m:{value:maskTex},p:{value:1},dim:{value:0}},vertexShader:vert,fragmentShader:frag(useMask),transparent:useMask,depthWrite:!useMask});
  const skyMat=mkLayer(false), bldMat=mkLayer(true);
  const sky=new THREE.Mesh(new THREE.PlaneGeometry(1,1),skyMat), bld=new THREE.Mesh(new THREE.PlaneGeometry(1,1),bldMat);

  // the fireworks painted in the Diwali sky, set moving: each one rises, blooms, crackles, drifts down and fades, in turn
  const BAND=464/1935;
  const fwMat=new THREE.ShaderMaterial({uniforms:{f:{value:texLoader(blank)},t:{value:0},amt:{value:F[cur].id==='diwali'?1:0},dim:{value:0}},
    vertexShader:vert, transparent:true, depthWrite:false, depthTest:false, blending:THREE.AdditiveBlending,
    fragmentShader:`
    uniform sampler2D f; uniform float t, amt, dim; varying vec2 vUv;
    const float AR=464./1080.;
    float h(vec2 q){ return fract(sin(dot(q,vec2(12.9898,78.233)))*43758.5453); }
    vec3 one(vec2 uv, vec2 c, float r, float per, float off){
      float ph=fract((t+off)/per); vec3 col=vec3(0.);
      if(ph<.13){ float q=ph/.13; q=q*q*(3.-2.*q); float py=mix(.08,c.y,q);
        float dx=abs(uv.x-c.x), dy=uv.y-py;
        float head=exp(-(dx*dx+dy*dy*AR*AR)/.0000035);
        float trail=dy<0.&&dy>-.16? exp(-dx*dx/.0000012)*(1.+dy/.16)*.45:0.;
        return vec3(1.,.84,.6)*(head*1.4+trail); }
      float q=(ph-.13)/.87;
      float e=1.-pow(1.-min(q/.5,1.),3.); float s=.1+.95*e;
      vec2 src=c+(uv-c)/s; src.y+=.07*q*q;
      vec2 d=vec2(src.x-c.x,(src.y-c.y)*AR);
      float own=1.-smoothstep(r*1.1,r*1.35,length(d));
      vec3 tx=texture2D(f,clamp(src,0.,1.)).rgb*own;
      float bri=smoothstep(0.,.05,q)*(1.-smoothstep(.38,1.,q));
      float tw=mix(1.,.45+.9*h(floor(src*vec2(360.,155.))+floor(t*16.)),smoothstep(.3,.65,q));
      vec2 du=vec2(uv.x-c.x,(uv.y-c.y)*AR);
      float flash=(1.-smoothstep(0.,.07,q))*exp(-dot(du,du)/(r*r*.05))*.8;
      return tx*bri*tw*1.15+vec3(1.,.86,.62)*flash;
    }
    void main(){
      vec3 c=one(vUv,vec2(.29,.583),.15,3.6,0.)+one(vUv,vec2(.60,.708),.14,4.1,1.7)+one(vUv,vec2(.87,.583),.09,4.9,3.1);
      gl_FragColor=vec4(c*amt*dim*dim,1.);
      #include <colorspace_fragment>
    }`});
  const fw=new THREE.Mesh(new THREE.PlaneGeometry(1,BAND),fwMat); fw.position.set(0,.5-BAND/2,.001); sky.add(fw);
  loadImg(CDN+A.fw).then(img=>{ fwMat.uniforms.f.value=texLoader(img); }).catch(()=>{});

  const courtDone=courtPromise.then(([ambImg,maskImg])=>{
    // fresh textures: three.js allocates fixed-size storage, so the placeholders cannot simply be resized
    const c0=cur; ambTex[c0]=texLoader(ambImg); const mT=new THREE.Texture(maskImg); mT.needsUpdate=true;
    for(const m of [skyMat,bldMat]){ m.uniforms.a.value=m.uniforms.b.value=ambTex[c0]; m.uniforms.m.value=mT; }
  });
  const court=new THREE.Group(); court.add(sky,bld); scene.add(court);
  const Z={card:0,cam0:3,cam1:1.15,bld:-2.2,sky:-3.0};
  sky.position.z=Z.sky; bld.position.z=Z.bld;
  sky.renderOrder=0; fw.renderOrder=1; bld.renderOrder=2;

  // ── light
  const amb=new THREE.AmbientLight(0xffffff,1.6); scene.add(amb);
  const key=new THREE.DirectionalLight(0xfffaf2,1.7); key.position.set(-1.6,2.2,3.4); key.castShadow=true;
  key.shadow.mapSize.set(1024,1024); key.shadow.bias=-.0006; key.shadow.normalBias=.02;
  const sc=key.shadow.camera; sc.left=-1.6; sc.right=1.6; sc.top=2.2; sc.bottom=-2.2; sc.near=.5; sc.far=10;
  scene.add(key); scene.add(key.target);
  const spill=new THREE.PointLight(0xffc56b,0,4,1.6); spill.position.set(0,0,-.35); scene.add(spill);

  // ── fit everything to the screen
  let W=1,H=1;
  function layout(){
    const r=stage.getBoundingClientRect(); W=r.width; H=r.height;
    renderer.setSize(W,H,false); camera.aspect=W/H; camera.updateProjectionMatrix();
    const ar=1080/1910;
    // the card covers the screen at the start
    const vh=visH(Z.cam0-Z.card), vw=vh*camera.aspect;
    CH=Math.min(vh*.8, vw*.86/ar); CW=CH*ar; card.position.y=vh*.025;
    // each courtyard layer covers the screen at the end, with room for tilt
    const arC=1080/1935;
    const fit=(z,extra)=>{ const h=visH(Z.cam1-z), w=h*camera.aspect; const hh=Math.max(h,w/arC)*extra; return [hh*arC,hh]; };
    // full bleed: each layer covers the screen, with a little room for the tilt
    // full width, hung from the top; on tall phones it stops above the bar so the rangoli and the pool stay clear
    const dk=$('#dock').getBoundingClientRect(), freeB=Math.min(.16,(dk.height-12)/H);
    const hang=(z,extra)=>{ const Hv=visH(Z.cam1-z), Wv=Hv*camera.aspect; const hh=Math.max(Hv*(1-freeB), Wv/arC)*extra; return [hh*arC,hh,Hv/2-hh/2+Hv*.004]; };
    let [w1,h1,y1]=hang(Z.bld,1.02); bld.scale.set(w1,h1,1); bld.position.y=y1;
    let [w2,h2,y2]=hang(Z.sky,1.04); sky.scale.set(w2,h2,1); sky.position.y=y2;
    const sw=Math.min(CW*.36,.62); seal.scale.set(sw,sw,1); sealShadow.scale.set(sw*.98,sw*.98,1);
  }
  addEventListener('resize',layout); layout();
  camera.position.set(0,0,Z.cam0);

  // ── state for the opening
  const S={press:0,lift:0,peel:0,glow:0,cam:0,fadeCard:0,dimUp:0};
  L.angle=0; R.angle=0;
  function frameCard(){
    const eL=shapePage(L), eR=shapePage(R);
    // the seal is fixed to the left page's edge and presses across onto the right page
    const sw=seal.scale.x, off=0; // centred on the fold, fixed to the left page
    const th=eL.th;
    seal.position.set(eL.x+Math.cos(th)*off, -CH*.07, eL.z+Math.sin(th)*off+.004+S.lift*.05);
    seal.rotation.set(0,-th,0); seal.rotateY(-S.peel); seal.scale.setScalar(sw*(1-S.press*.05)); seal.scale.z=1;
    sealShadow.position.set(seal.position.x+.012,seal.position.y-.018,eL.z+.003); sealShadow.rotation.y=-th;
    sealShadow.material.opacity=.18*(1-Math.min(1,L.angle*2))+S.lift*.05;
  }

  // ── tilt: the courtyard layers shift against each other
  let tx=0,ty=0,cx=0,cy=0,tilt=false;
  addEventListener('deviceorientation',e=>{ if(e.gamma==null)return; tilt=true; tx=Math.max(-1,Math.min(1,e.gamma/25)); ty=Math.max(-1,Math.min(1,(e.beta-50)/25)); });

  let opened=false, t0=performance.now();
  function render(now){
    const t=(now-t0)/1000;
    frameCard();
    // camera: from the card, through the opening, into the courtyard
    const z=Z.cam0+(Z.cam1-Z.cam0)*S.cam;
    if(!tilt){ tx=Math.sin(t*.19)*.55; ty=Math.cos(t*.15)*.3; }
    cx+=(tx-cx)*.05; cy+=(ty-cy)*.05;
    const k=S.cam; // tilt only once inside
    const breathe=opened?0:Math.sin(t*1.1)*.012;
    const idle=1-Math.min(1,L.angle*3);
    card.rotation.y=Math.sin(t*.55)*.07*idle; card.rotation.x=Math.cos(t*.43)*.035*idle;
    skyMat.uniforms.dim.value=bldMat.uniforms.dim.value=S.dimUp;
    camera.position.set(cx*.1*k, -cy*.06*k+breathe*.3, z);
    camera.lookAt(cx*.03*k, 0, Z.bld);
    spill.intensity=S.glow*3.2;
    fwMat.uniforms.t.value=t; fwMat.uniforms.dim.value=S.dimUp;
    renderer.render(scene,camera);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  // the cover is ready: reveal it
  if(window.__fallback) return; window.__ready=true;
  $('#touch').style.color='var(--gold)'; $('#touch').style.bottom='calc(4.5% + env(safe-area-inset-bottom))';
  $('#loader').style.opacity=0; setTimeout(()=>$('#loader').remove(),900);
  setText(cur,false); selectIcon(cur,false);
  if(G){ G.to('#touch',{opacity:1,duration:.9,delay:.6}); G.to('#touch',{opacity:.35,duration:1.4,repeat:-1,yoyo:true,ease:'sine.inOut',delay:1.5}); }
  else $('#touch').style.opacity=1;
  $('#hit').style.display='block';

  async function open(){
    if(opened)return; opened=true; $('#hit').style.display='none';
    await courtDone.catch(()=>{});
    try{ if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().catch(()=>{}); }catch(e){}
    if(!G){ L.angle=2.9; R.angle=2.9; S.cam=1; S.dimUp=1; card.visible=seal.visible=false; showUI(); return; }
    G.killTweensOf('#touch'); G.to('#touch',{opacity:0,duration:.3});
    const tl=G.timeline(); window.__open=tl; if(TEST) tl.pause();
    tl.to(S,{press:1,duration:.12,ease:'power2.out',onStart:()=>sfx('click')})
      .to(S,{press:0,lift:1,peel:.22,duration:.45,ease:'power2.out'})
      .to(S,{peel:0,duration:.35,ease:'power2.inOut'},'>-.1')
      .add('L')
      .to(L,{angle:2.95,duration:1.7,ease:'power2.inOut',onStart:()=>sfx('swing')},'L')
      .to(L,{bend:-.42,duration:.85,ease:'sine.out',yoyo:true,repeat:1},'L')
      .to(S,{glow:.55,duration:.9,ease:'power1.out'},'L+=.25')
      .to(S,{dimUp:1,duration:2.2,ease:'power1.inOut'},'L+=.2')
      .add('R','L+=.55')
      .to(R,{angle:2.95,duration:1.7,ease:'power2.inOut'},'R')
      .to(R,{bend:-.42,duration:.85,ease:'sine.out',yoyo:true,repeat:1},'R')
      .to(S,{glow:1,duration:.8,ease:'power1.out'},'R+=.2')
      .to(S,{cam:1,duration:2.6,ease:'power2.inOut'},'R+=.35')
      .to(S,{glow:0,duration:1.2,ease:'power1.in'},'R+=1.6')
      .add(()=>{ card.visible=false; seal.visible=false; sealShadow.visible=false; },'R+=2.3')
      .add(showUI,'R+=2.0');
  }
  $('#hit').addEventListener('click',open);
  $('#hit').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();open();} });

  function showUI(){
    layout();
    $('#ui').style.visibility='visible';
    if(G){ G.fromTo('#msg',{opacity:0,filter:'blur(6px)'},{opacity:1,filter:'blur(0px)',duration:1.6,ease:'sine.out'});
      G.fromTo('#dock',{opacity:0},{opacity:1,duration:1.2,delay:.6,ease:'sine.out'});
      selectIcon(cur,true);
      G.fromTo('.top',{opacity:0},{opacity:1,duration:.8,delay:.6});
      G.to('#hint',{opacity:1,duration:.8,delay:1.4}); }
    // fetch the other four lights quietly
    F.forEach((f,i)=>{ if(!ambTex[i]) loadImg(CDN+f.img).then(img=>{ ambTex[i]=texLoader(img); renderer.initTexture&&renderer.initTexture(ambTex[i]); }).catch(()=>{}); });
  }

  // ── tapping a day relights the courtyard
  let busy=false, hinted=false;
  days.addEventListener('click',async e=>{
    const b=e.target.closest('button'); if(!b)return; const i=+b.dataset.i; if(i===cur||busy)return;
    if(!hinted){ hinted=true; G&&G.to('#hint',{opacity:0,duration:.5}); }
    busy=true;
    if(!ambTex[i]){ try{ ambTex[i]=texLoader(await loadImg(CDN+F[i].img)); }catch(err){ busy=false; return; } }
    cur=i; setText(i,true); selectIcon(i,true); sfx('sweep');
    for(const m of [skyMat,bldMat]){ m.uniforms.b.value=ambTex[i]; m.uniforms.p.value=0; }
    const done=()=>{ for(const m of [skyMat,bldMat]){ m.uniforms.a.value=ambTex[i]; m.uniforms.p.value=1; } busy=false; };
    const fwTo=F[i].id==='diwali'?1:0;
    if(!G){ done(); fwMat.uniforms.amt.value=fwTo; return; }
    const st={p:0};
    G.to(st,{p:1,duration:2.4,ease:'sine.inOut',onUpdate:()=>{ for(const m of [skyMat,bldMat]) m.uniforms.p.value=st.p; },onComplete:done});
    G.to(fwMat.uniforms.amt,{value:fwTo,duration:1.6,delay:fwTo?1.1:0,ease:'sine.inOut'});
  });
  // the shader's p means "how far the new light has come": a=old, b=new, e picks old where s is beyond the edge
}

/* ── for phones without 3D: the same greeting, plainly */
function plainVersion(){
  const st=$('#stage'); canvas.style.display='none';
  const bg=document.createElement('div'); bg.style.cssText='position:absolute;inset:0;background:#141a2e center/cover no-repeat;transition:opacity 1.2s';
  st.insertBefore(bg,st.firstChild); if(window.__fallback) return; window.__ready=true;
  const cover=document.createElement('div'); cover.style.cssText=`position:absolute;inset:0;z-index:4;background:#efe3c9 url(${CDN+A.card}) center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s`;
  cover.innerHTML=`<div style="color:#8E6A15;font-weight:400;font-size:13px;letter-spacing:.26em;margin-top:-40%">DIWALI 2026</div><div style="color:#1B1A16;font-size:28px;text-align:center;line-height:1.25;margin-top:12px">Please accept<br>our warmest greetings<br>this Diwali</div><div style="width:150px;height:150px;margin-top:9vh;background:url(${CDN+A.seal}) center/contain no-repeat"></div>`;
  st.insertBefore(cover,$('#touch'));
  $('#loader').remove(); $('#touch').style.opacity=1; $('#hit').style.display='block';
  const show=i=>{ bg.style.backgroundImage=`url(${CDN+F[i].img})`; setText(i,!!G); selectIcon(i,!!G); };
  show(cur);
  $('#hit').addEventListener('click',()=>{ $('#hit').style.display='none'; cover.style.opacity=0; $('#touch').style.opacity=0; setTimeout(()=>cover.remove(),900); $('#ui').style.visibility='visible'; $('#hint').style.opacity=1; },{once:true});
  days.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; cur=+b.dataset.i; $('#hint').style.opacity=0; bg.style.opacity=.2; setTimeout(()=>{ show(cur); bg.style.opacity=1; },400); });
}
</script>
</body>
